
<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Music Studio</title>
</head>
<body>
<div class="studio-card">
    <div class="header-title">🎵 All Music Studio 🎵</div>
    
    <button class="btn-audio-files" onclick="document.getElementById('fileInput').click()">📁 ఆడియో ఫైల్స్ ఎంచుకోండి</button>
    <input type="file" id="fileInput" accept="audio/*" onchange="loadFile(event)">
    
    <div class="editor-section">
        <p id="fileName">ఫైల్ ఇంకా ఎంచుకోలేదు</p>
        <audio id="audioPlayer" controls style="display:none;"></audio>

        <div class="control-block">
            <label>🧹 నాయిస్ కంట్రోల్</label>
            <div class="slider-row">
                <button class="btn-step" onclick="changeVal('noise', -5)">-</button>
                <input type="range" id="noise" min="0" max="100" value="50" oninput="updateFilters()">
                <button class="btn-step" onclick="changeVal('noise', 5)">+</button>
                <span id="noise-val" class="val-display">50%</span>
            </div>
        </div>

        <div class="control-block">
            <label>🎤 స్టూడియో వాయిస్</label>
            <div class="slider-row">
                <button class="btn-step" onclick="changeVal('voice', -5)">-</button>
                <input type="range" id="voice" min="0" max="100" value="70" oninput="updateFilters()">
                <button class="btn-step" onclick="changeVal('voice', 5)">+</button>
                <span id="voice-val" class="val-display">70%</span>
            </div>
        </div>

        <div class="control-block">
            <label>🔊 బేస్ & టోన్</label>
            <div class="slider-row">
                <button class="btn-step" onclick="changeVal('bass', -5)">-</button>
                <input type="range" id="bass" min="0" max="100" value="50" oninput="updateFilters()">
                <button class="btn-step" onclick="changeVal('bass', 5)">+</button>
                <span id="bass-val" class="val-display">50%</span>
            </div>
        </div>
        
        <button class="btn-get-started" onclick="processAudio()">🚀 ప్రాసెస్ చేసి ప్లే చేయి</button>
        <p id="status"></p>
    </div>
</div>
<script>
    let audioCtx, source, noiseFilter, voiceFilter, bassFilter;

    function loadFile(event) {
        const file = event.target.files[0];
        if (file) {
            document.getElementById('fileName').innerText = "ఫైల్: " + file.name;
            const player = document.getElementById('audioPlayer');
            player.src = URL.createObjectURL(file);
            player.style.display = "block";
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
        }
    }

    function changeVal(id, step) {
        const input = document.getElementById(id);
        let newVal = parseInt(input.value) + step;
        if (newVal < 0) newVal = 0; if (newVal > 100) newVal = 100;
        input.value = newVal; updateFilters();
    }

    function setupAudioEngine() {
        const player = document.getElementById('audioPlayer');
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(player);

        noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = "highpass";
        voiceFilter = audioCtx.createBiquadFilter(); voiceFilter.type = "peaking"; voiceFilter.frequency.value = 2500;
        bassFilter = audioCtx.createBiquadFilter(); bassFilter.type = "lowshelf"; bassFilter.frequency.value = 200;

        source.connect(noiseFilter);
        noiseFilter.connect(voiceFilter);
        voiceFilter.connect(bassFilter);
        bassFilter.connect(audioCtx.destination);
    }

    function updateFilters() {
        const nVal = document.getElementById('noise').value;
        const vVal = document.getElementById('voice').value;
        const bVal = document.getElementById('bass').value;

        document.getElementById('noise-val').innerText = nVal + '%';
        document.getElementById('voice-val').innerText = vVal + '%';
        document.getElementById('bass-val').innerText = bVal + '%';

        if (audioCtx) {
            noiseFilter.frequency.value = (nVal / 100) * 800;
            voiceFilter.gain.value = ((vVal - 50) / 50) * 15;
            bassFilter.gain.value = ((bVal - 50) / 50) * 12;
        }
    }

    function processAudio() {
        const player = document.getElementById('audioPlayer');
        if (!player.src) { alert('దయచేసి ముందుగా ఒక ఆడియో ఫైల్‌ను ఎంచుకోండి!'); return; }
        if (!audioCtx) { setupAudioEngine(); }
        updateFilters(); player.play();
        document.getElementById('status').innerText = "✨ అన్ని ఫిల్టర్లు వర్క్ అవుతున్నాయి!";
    }
</script>
</body>
</html>
