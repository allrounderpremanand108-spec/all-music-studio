<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Music Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { width: 100%; display: flex; align-items: center; }
        .back-btn { background: #1e293b; color: #ffffff; border: 1px solid #334155; font-size: 24px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .header { text-align: center; margin: 10px 0; }
        .main-title { font-size: 30px; font-weight: 900; letter-spacing: 1px; color: #38bdf8; text-transform: uppercase; text-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .sub-title { font-size: 18px; font-weight: 700; color: #f43f5e; letter-spacing: 2px; margin-top: 6px; text-transform: uppercase; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 10px 0; }
        .sq-btn { aspect-ratio: 1 / 1; border: none; border-radius: 20px; font-size: 17px; font-weight: 800; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 15px rgba(0,0,0,0.5); text-transform: uppercase; }
        .red-btn { background: linear-gradient(145deg, #ef4444, #dc2626); border: 1px solid #f87171; }
        .green-btn { background: linear-gradient(145deg, #10b981, #059669); border: 1px solid #34d399; }
        .player-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 20px; text-align: center; margin: 5px 0; }
        .play-btn { background: #ffffff; color: #0f172a; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 26px; cursor: pointer; margin: 0 auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }
        .next-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; border-radius: 16px; font-size: 18px; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn">&#8592;</button>
    </div>
    <div class="header">
        <h1 class="main-title">ALL MUSIC STUDIO</h1>
        <div class="sub-title">PREMANAND APPS</div>
    </div>
    <div class="button-grid">
        <button class="sq-btn red-btn">New Record</button>
        <button class="sq-btn green-btn">Audio Files</button>
    </div>
    <div class="player-card">
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px; letter-spacing: 1px;">PREVIEW PLAYER</p>
        <button class="play-btn">&#9654;</button>
    </div>
    <button class="next-btn">NEXT</button>
</body>
</html>
