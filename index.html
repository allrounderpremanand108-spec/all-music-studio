
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Music Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16, #111827, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: none;
            font-size: 28px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Titles Section */
        .header {
            text-align: center;
            margin: 15px 0;
        }

        .main-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #ff007f, #9333ea, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(147, 51, 234, 0.3);
            line-height: 1.2;
        }

        .sub-title {
            font-size: 20px;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-top: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Square Buttons Grid */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .sq-btn {
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .red-btn {
            background: linear-gradient(145deg, #ff2a5f, #d90429);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .green-btn {
            background: linear-gradient(145deg, #10b981, #059669);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Player Section */
        .player-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            margin: 10px 0;
        }

        .play-btn {
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            color: #0f172a;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Next Button */
        .next-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Back Arrow -->
    <div class="top-bar">
        <button class="back-btn">&#8592;</button>
    </div>

    <!-- Title Section -->
    <div class="header">
        <h1 class="main-title">ALL MUSIC STUDIO</h1>
        <div class="sub-title">PREMANAND APPS</div>
    </div>

    <!-- Big Square Buttons -->
    <div class="button-grid">
        <button class="sq-btn red-btn">New Record</button>
        <button class="sq-btn green-btn">Audio Files</button>
    </div>

    <!-- Play Audio Section -->
    <div class="player-card">
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px; letter-spacing: 1px;">PREVIEW PLAYER</p>
        <button class="play-btn">&#9654;</button>
    </div>

    <!-- Bottom Next Button -->
    <button class="next-btn">NEXT</button>

</body>
</html>
