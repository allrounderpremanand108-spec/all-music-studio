
<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Music Studio</title>
    <!-- 🧱🧱🧱 CSS డిజైన్ ప్రారంభం 🧱🧱🧱 -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .studio-card { width: 100%; max-width: 450px; background: #1e1e1e; border-radius: 16px; padding: 20px; border: 1px solid #333; }
        .header-title { text-align: center; color: #1db954; font-size: 1.4rem; margin-bottom: 20px; font-weight: bold; }
        .btn-audio-files { background-color: #2196f3; color: white; width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; font-size: 1rem; }
        .editor-section { background: #2a2a2a; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .control-block { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #444; }
        .control-block label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #1db954; font-weight: bold; }
        .slider-row { display: flex; align-items: center; gap: 8px; }
        .slider-row input[type="range"] { flex: 1; accent-color: #1db954; height: 6px; }
        .btn-step { background: #333; color: #1db954; border: 1px solid #555; width: 32px; height: 32px; border-radius: 6px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .val-display { width: 35px; text-align: center; font-size: 0.85rem; color: #aaa; }
        input[type="file"] { display: none; }
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
        .btn-get-started { width: 100%; padding: 15px; background: #ff9800; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #status { text-align: center; margin-top: 10px; font-size: 0.9rem; color: #1db954; font-weight: bold; }
        #fileName { text-align: center; color: #aaa; margin-bottom: 10px; }
    </style>
    <!-- 🧱🧱🧱 CSS డిజైన్ ముగింపు 🧱🧱🧱 -->
</head>
