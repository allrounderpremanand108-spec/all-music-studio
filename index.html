
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Music Studio</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
        }

        .back-btn {
            font-size: 24px;
            color: white;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            background: linear-gradient(to right, #ff007f, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 30px;
        }

        .sub-title {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 5px;
        }

        .btn-row {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .red-btn { background-color: #ef4444; }
        .green-btn { background-color: #22c55e; }

        .play-area {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .play-btn {
            background: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Back Arrow -->
        <div class="back-btn">&#8592;</div>

        <!-- Title Section -->
        <div class="header">
            <h1>ALL MUSIC STUDIO</h1>
            <div class="sub-title">Premanand Apps</div>
        </div>

        <!-- New Record & Audio Files -->
        <div class="btn-row">
            <button class="btn red-btn">New Record</button>
            <button class="btn green-btn">Audio Files</button>
        </div>

        <!-- Play Button -->
        <div class="play-area">
            <button class="play-btn">&#9654;</button>
        </div>

        <!-- Next Button -->
        <button class="next-btn">NEXT</button>
    </div>

</body>
</html>
