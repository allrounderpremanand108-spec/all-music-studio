
<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Music Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* రాఘవేంద్రరావు కలర్స్ - వైబ్రెంట్ బ్యాక్‌గ్రౌండ్ */
        body { 
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfa2, #ffb800);
            background-size: 300% 300%;
            animation: colorShift 12s ease infinite;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        @keyframes colorShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* మెయిన్ కార్డ్ డిజైన్ */
        .studio-card { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(15, 12, 41, 0.85); 
            backdrop-filter: blur(10px);
            border-radius: 24px; 
            padding: 20px; 
            border: 3px solid #ffeb3b; 
            box-shadow: 0 0 30px rgba(255, 235, 59, 0.5); 
        }

        .header-title { 
            text-align: center; 
            background: linear-gradient(45deg, #ffeb3b, #ff007f, #00e5ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-size: 1.8rem; 
            margin-bottom: 15px; 
            font-weight: 900; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* బటన్లు */
        .btn-file { 
            background: linear-gradient(45deg, #00c6ff, #0072ff); 
            color: white; 
            width: 100%; 
            padding: 16px; 
            border: 2px solid #fff; 
            border-radius: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1.1rem; 
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); 
            margin-bottom: 15px;
        }

        .control-block { 
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(0, 229, 255, 0.2)); 
            padding: 14px; 
            border-radius: 15px; 
            margin-bottom: 12px; 
            border: 1.5px solid #ff007f; 
        }
        
        .control-block label { 
            display: block; 
            font-size: 1rem; 
            margin-bottom: 8px; 
            color: #ffeb3b; 
            font-weight: bold; 
        }

        .control-block input[type="range"] {
            width: 100%;
            accent-color: #ffeb3b;
        }

        .btn-go-music { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(45deg, #ff007f, #ff9900); 
            color: white; 
            border: 2px solid #ffeb3b; 
            border-radius: 15px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.6); 
            margin-top: 10px;
        }

        /* పేజీ 2 - దీర్ఘచతురస్రాకారపు బాక్సులు */
        .page-2 { display: none; }
        
        .split-container { 
            display: flex; 
            gap: 12px; 
            margin-top: 15px; 
        }

        .big-box { 
            flex: 1; 
            padding: 22px 10px; 
            text-align: center; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .big-box:active { transform: scale(0.96); }

        .box-rhythm { 
            background: linear-gradient(135deg, #ff007f, #7928ca); 
            border: 2px solid #ffeb3b; 
        }

        .box-lead { 
            background: linear-gradient(135deg, #00b4db, #0083b0); 
            border: 2px solid #00ff66; 
        }

        /* రిథమ్ స్క్రోలింగ్ లిస్ట్ */
        .rhythm-section { 
            display: none; 
            margin-top: 20px; 
            background: rgba(0, 0, 0, 0.4); 
            padding: 15px; 
            border-radius: 16px; 
            border: 1px solid #ff007f;
        }

        .scroll-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 10px; 
            padding: 10px 0; 
        }

        .inst-card { 
            min-width: 120px; 
            background: linear-gradient(135deg, #ff9900, #ff0055); 
            padding: 12px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1.5px solid #fff; 
            cursor: pointer; 
        }

        .btn-ok { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(45deg, #00ff66, #00b0ff); 
            color: #000; 
            border: 2px solid #fff; 
            border-radius: 15px; 
            font-size: 1.2rem; 
            font-weight: 900; 
            cursor: pointer; 
            margin-top: 20px; 
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.5); 
        }
    </style>
</head>
<body>

<div class="studio-card">
    <!-- 🎵 పేజీ 1 (వాయిస్ ఎడిటింగ్) -->
    <div id="page1">
        <div class="header-title">🎵 All Music Studio 🎵</div>

        <button class="btn-file" onclick="document.getElementById('fileInput').click()">📁 ఆడియో ఫైల్స్ ఎంచుకోండి</button>
        <input type="file" id="fileInput" accept="audio/*" style="display:none;" onchange="document.getElementById('fileName').innerText = 'ఫైల్: ' + this.files[0].name">
        <p id="fileName" style="text-align:center; color:#ffeb3b; margin-bottom:15px; font-weight:bold;">ఫైల్ ఇంకా ఎంచుకోలేదు</p>

        <div class="control-block">
            <label>🧹 నాయిస్ కంట్రోల్</label>
            <input type="range" value="50">
        </div>

        <div class="control-block">
            <label>🎤 స్టూడియో వాయిస్</label>
            <input type="range" value="70">
        </div>

        <div class="control-block">
            <label>🔊 బేస్ & టోన్</label>
            <input type="range" value="50">
        </div>

        <!-- గో టు మ్యూజిక్ బటన్ ఒక్కటే ఉంటుంది -->
        <button class="btn-go-music" onclick="document.getElementById('page1').style.display='none'; document.getElementById('page2').style.display='block';">గో టు మ్యూజిక్ ➔</button>
    </div>

    <!-- 🥁 పేజీ 2 (రిథమ్ & లీడ్ ఇన్స్ట్రుమెంట్స్) -->
    <div id="page2" class="page-2">
        <div class="header-title">🎶 Music Hub 🎶</div>

        <!-- రెండు దీర్ఘచతురస్రాకారపు బాక్సులు పక్కపక్కనే -->
        <div class="split-container">
            <div class="big-box box-rhythm" onclick="document.getElementById('rhythmSection').style.display='block'">
                <div style="font-size:2rem; margin-bottom:5px;">🥁</div>
                All Rhythm Instruments
            </div>
            <div class="big-box box-lead">
                <div style="font-size:2rem; margin-bottom:5px;">🎸</div>
                All Lead Instruments
            </div>
        </div>

        <!-- రిథమ్ క్లిక్ చేయగానే వచ్చే స్క్రోలింగ్ ఆప్షన్లు -->
        <div id="rhythmSection" class="rhythm-section">
            <p style="color:#00e5ff; font-weight:bold; margin-bottom:8px;">👉 ఇన్‌స్ట్రుమెంట్ ఎంచుకోండి:</p>
            <div class="scroll-container">
                <div class="inst-card" onclick="alert('తబలా యాడ్ అయింది!')">
                    <div style="font-size:1.5rem;">🥁</div>
                    <h4>తబలా</h4>
                    <p style="font-size:0.8rem; color:#ffeb3b;">+ యాడ్ చేయి</p>
                </div>
                <div class="inst-card" onclick="alert('ఢోలక్ యాడ్ అయింది!')">
                    <div style="font-size:1.5rem;">🪘</div>
                    <h4>ఢోలక్</h4>
                    <p style="font-size:0.8rem; color:#ffeb3b;">+ యాడ్ చేయి</p>
                </div>
                <div class="inst-card" onclick="alert('డ్రమ్స్ యాడ్ అయింది!')">
                    <div style="font-size:1.5rem;">🎸</div>
                    <h4>డ్రమ్స్</h4>
                    <p style="font-size:0.8rem; color:#ffeb3b;">+ యాడ్ చేయి</p>
                </div>
            </div>

            <div class="control-block" style="margin-top:15px;">
                <label>⚡ టెంపో (Speed & Sync)</label>
                <input type="range" value="50">
            </div>
        </div>

        <!-- ఓకే కొడితే ఫస్ట్ పేజీకి వెళ్తుంది -->
        <button class="btn-ok" onclick="document.getElementById('page2').style.display='none'; document.getElementById('page1').style.display='block';">✅ ఓకే (Done)</button>
    </div>
</div>

</body>
</html>
